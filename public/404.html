<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Esteban Silva — Fotografia</title>
    <script>
      // GitHub Pages has no server-side rewrites, so a direct hit on a
      // client-routed path (e.g. /andante/galeria) 404s. This is the
      // well-known "spa-github-pages" redirect: encode the real path into a
      // query string and bounce to the app root, where index.html's own
      // script restores it via history.replaceState before React Router
      // ever reads the URL.
      var pathSegmentsToKeep = 1; // keep "/andante"
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
